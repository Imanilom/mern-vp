services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build: 
      context: ./api
    container_name: backend
    ports:
      - "3030:3030"
    environment:
      - MONGO=mongodb://mongodb:27017/healthdevice
      - JWT_SECRET=asnjkKkjsnklnly1xcx?23r
      - PORT=3030
      - INTERNAL_KEY=mern-vp-internal-systemd-2026
      # Tambahkan env lainnya jika perlu. Pastikan MONGO mengarah ke mongodb service.
    depends_on:
      - mongodb
    restart: always

  frontend:
    build: 
      context: ./backoffice
    container_name: frontend
    ports:
      - "3031:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
