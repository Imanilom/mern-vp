services:
  mongodb:
    image: mongo:8.0-noble
    container_name: mongodb
    # Port MongoDB TIDAK di-expose ke host/internet
    # Hanya bisa diakses oleh container lain dalam network 'app-network'
    expose:
      - "27017"
    # Baca credentials dari .env.production (sama seperti service backend)
    # Sehingga tidak perlu file .env terpisah untuk variable interpolation
    env_file:
      - .env.production
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./api
      args:
        NODE_ENV: production
    container_name: backend
    # Hanya listen ke localhost (127.0.0.1) — hanya Nginx yang bisa akses
    ports:
      - "127.0.0.1:3030:3030"
    env_file:
      - .env.production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    # Batasi resource agar satu container tidak memakan semua memori server
    mem_limit: 512m
    cpus: "1.0"

  frontend:
    build:
      context: ./backoffice
    container_name: frontend
    ports:
      - "127.0.0.1:3031:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 128m

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
