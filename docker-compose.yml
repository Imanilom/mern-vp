services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mern-vp-rabbitmq
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongodb:
    image: mongo:6.0
    container_name: mern-vp-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: capar_admin
      MONGO_INITDB_ROOT_PASSWORD: SecurePassword123! # Ganti dengan password yang lebih kuat
    ports:
      # HANYA ekspos ke localhost VPS (127.0.0.1) agar tidak bisa diakses dari internet publik
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build: ./api
    container_name: mern-vp-api
    restart: always
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ./data:/app/data
      - ./data:/data
    env_file:
      - ./.env
    environment:
      PORT: 3030
      NODE_ENV: production
      TRUST_PROXY: loopback,linklocal,uniquelocal
      ALLOWED_ORIGINS: https://vidyamedic.my.id,https://www.vidyamedic.my.id
    depends_on:
      - rabbitmq
      - mongodb
    dns:
      - 103.253.213.134
      - 203.175.8.227

  vidyamedic-web:
    build: ./vidyamedic-web
    container_name: mern-vp-vidyamedic-web
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  rabbitmq_data:
  mongodb_data:
