function aiReply(q){let x=q.toLowerCase();if(x.includes('pulih')||x.includes('recover'))return 'Dari contoh yang ada, belum cukup bukti untuk menyatakan pemulihan lengkap. Perlu lintasan setelah episode, konteks terkonfirmasi, dan kecukupan kualitas data. Saya akan menandai status sebagai “perlu observasi lanjutan”.';if(x.includes('mengapa')||x.includes('penyebab')||x.includes('naik')||x.includes('hr'))return 'Pada data simulasi, HR meningkat hingga 110 bpm sementara label awal menunjukkan istirahat. Perbedaan ini dapat berkaitan dengan aktivitas sebelumnya, stres mental, respons fisiologis, atau kesalahan sensor. Kita perlu mengklarifikasi konteks sebelum memberi penjelasan lebih spesifik.';if(x.includes('harus')||x.includes('rekomendasi')||x.includes('lakukan'))return 'Langkah yang bisa dipertimbangkan: pastikan pemasangan sensor baik; konfirmasi aktivitas dan gejala; amati pola setelah kembali tenang; konsultasikan kepada tenaga kesehatan bila perubahan menetap atau berulang. Jika ada nyeri dada, pingsan, atau sesak berat, segera cari pertolongan medis.';if(x.includes('ubah')||x.includes('berubah')||x.includes('deviasi'))return 'Contoh perubahan utama adalah kenaikan HR dari kisaran baseline istirahat ilustratif 68–82 bpm menuju 110 bpm sekitar 14.25. Sistem menyebutnya kandidat deviasi; signifikansi belum ditentukan tanpa kualitas sensor dan verifikasi konteks.';return 'Dalam mockup ini, saya hanya dapat menjelaskan data contoh dan alur kerja. Pertanyaan Anda perlu dinilai berdasarkan baseline personal, aktivitas aktual, kualitas data, dan riwayat episode. Untuk kondisi medis, keputusan akhir memerlukan tenaga kesehatan.'}
function downloadCSV(){let lines=['timestamp,heart_rate_bpm,expected_bpm,rmssd_ms,context,data_type'];hr.forEach((h,i)=>lines.push(`2026-10-25T${String(i).padStart(2,'0')}:00:00,${h},${ex[i]},${rmssd[i]},${i===14?'unverified_rest':'example_context'},SYNTHETIC_DEMO`));let blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Vidyamedic_Data_Simulasi.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',function(e){let el=e.target.closest('[data-mode],[data-web],[data-mobile],[data-period],[data-question],[data-action]');if(!el)return;if(el.dataset.mode){S.mode=el.dataset.mode;render();return}if(el.dataset.web){S.web=el.dataset.web;render();return}if(el.dataset.mobile){S.mobile=el.dataset.mobile;render();return}if(el.dataset.period){S.period=el.dataset.period;render();return}if(el.dataset.question){let q=el.dataset.question;let idx=S.chat.length;S.chat.push({from:'user',text:q},{from:'ai',text:'Menghubungi layanan penjelasan...'});render();window.vmAskAI(q).then(answer=>{if(S.chat[idx+1])S.chat[idx+1].text=answer;render();});let b=document.querySelector('.mobile-body');if(b)b.scrollTop=b.scrollHeight;return}let a=el.dataset.action;if(a==='context'){S.modal=true;S.toast='';render();return}if(a==='close'){S.modal=false;render();return}if(a==='device'){S.device=!S.device;S.toast=S.device?'Perangkat contoh disetel terhubung.':'Perangkat contoh disetel terputus.';render();return}if(a==='notifications'){S.notifications=!S.notifications;S.toast='Pengaturan notifikasi demo diperbarui.';render();return}if(a==='complete'){S.decisionDone=true;say('Tindakan ditandai selesai; mengirim ke API.');window.vmCompleteRecommendation();return}if(a==='goAI'){S.web='AI & Deteksi Dini';render();return}if(a==='goMonitoring'){S.web='Monitoring';render();return}if(a==='goDecision'){S.web='Rekomendasi & Keputusan';render();return}if(a==='goAdmin'){S.web='Administrasi';render();return}if(a==='goMobileAI'){S.mobile='Tanya AI';render();return}if(a==='goMobileInsight'){S.mobile='Insight';render();return}if(a==='export'){window.location.href='/api/reports/export.csv';S.toast='Permintaan CSV data sintetis dari API.';render();return}if(a==='print'){window.print();return}if(a==='sync'){window.vmRefresh().then(ok=>say(ok?'Data demonstrasi berhasil disinkronkan ke backend.':'Backend tidak aktif; tampilan tetap dalam mode lokal.'));return}if(a==='audit'||a==='privacy'){say('Fitur tata kelola tersedia sebagai rancangan mockup dan belum tersambung ke backend.');return}if(a==='notificationsInfo'){say('Notifikasi demo: satu episode membutuhkan klarifikasi konteks.');return}});
document.addEventListener('submit',function(e){if(e.target.id==='context-form'){e.preventDefault();S.context=document.getElementById('context-choice').value;S.note=document.getElementById('context-note').value;S.contextDraft=S.context;S.contextConfirmed=true;S.modal=false;S.toast='Konteks diperbarui secara lokal; mengirim ke API.';render();window.vmSaveContext(S.context,S.note);return}if(e.target.id==='chat-form'){e.preventDefault();let v=document.getElementById('chat-input').value.trim();if(!v)return;let idx=S.chat.length;S.chat.push({from:'user',text:v},{from:'ai',text:'Menghubungi layanan penjelasan...'});render();window.vmAskAI(v).then(answer=>{if(S.chat[idx+1])S.chat[idx+1].text=answer;render();});let b=document.querySelector('.mobile-body');if(b)b.scrollTop=b.scrollHeight;return}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=false;render()}});
render();
